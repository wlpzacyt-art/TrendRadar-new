# ═══════════════════════════════════════════════════════════════
#        TrendRadar 配置文件 —— 职业投资人定制版
#              Based on Version 2.4.0
# ═══════════════════════════════════════════════════════════════

app:
  timezone: "Asia/Shanghai"            # A股/港股交易时段按北京时间对齐
  show_version_update: true

# 调度系统：建议先跑通首次推送后再开启。
# 推荐节奏：盘前晨报（隔夜美股复盘）→ 盘中增量 → 盘后当日汇总
schedule:
  enabled: false
  preset: "morning_evening"            # 全天增量 + 晚间当日汇总，适合复盘

# ── 数据源：热榜 ──
platforms:
  enabled: true
  api_url: ""
  sources:
    # 财经核心源
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"
    # 综合资讯源（保留，用于宏观政策与突发事件）
    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"
    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"
    # ── 可选增强源（启用前请确认你的 newsnow 实例支持，
    #    运行日志出现"未知平台"即删除对应项）──
     - id: "xueqiu-hotstock"
       name: "雪球热股"
       expected_domain: "xueqiu.com"
     - id: "gelonghui"
       name: "格隆汇"
       expected_domain: "gelonghui.com"
     - id: "36kr"
       name: "36氪"
       expected_domain: "36kr.com"

# ── 数据源：RSS（英文一手 AI/科技信息源，配合自动翻译）──
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://news.ycombinator.com/rss"
    - id: "arxiv-ai"
      name: "arXiv AI 论文速递"
      url: "https://export.arxiv.org/rss/cs.AI"
      max_age_days: 2                  # arXiv 按日批量更新，放宽到 2 天
    # 扩展建议：可用 RSSHub 自建 雪球热帖 / 华尔街见闻快讯 等国内财经源

# ── 报告模式 ──
report:
  mode: "incremental"                  # 增量监控：只推新增，盘中盯盘零重复
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0

# ── 筛选策略 ──
filter:
  method: "ai"                         # AI 语义筛选：杜绝"苹果/小米"歧义误伤
  priority_sort_enabled: true          # 按 ai_interests.txt 中的优先级排序

ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.6                       # 投资信息宁多勿漏；嫌噪音大再调回 0.7
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

# ── 推送内容与顺序 ──
display:
  region_order:
    - new_items                        # 新增热点置顶：盘中最需要时效
    - ai_analysis                      # AI 研判紧随其后
    - hotlist
    - rss
    - standalone
  regions:
    hotlist: true
    new_items: true                    # 开启：第一时间看到新增异动
    rss: true
    standalone: false                  # 不推送展示，避免消息过长
    ai_analysis: true
  standalone:
    platforms: ["cls-hot", "wallstreetcn-hot"]   # 全量纳入 AI 分析（见下）
    rss_feeds: []
    max_items: 20

# ── 推送渠道：任选其一填入（GitHub 部署请放 Secrets，勿公开）──
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""                          # iPhone 用户推荐，盘中弹窗触达最快
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""

# ── 存储 ──
storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7

# ── AI 模型 ──
ai:
  model: "gemini/gemini-3.1-flash-lite"  # 成本最优，高频调用无压力
  api_key: ""                          # 务必使用环境变量 AI_API_KEY
  api_base: "https://generativelanguage.googleapis.com/v1beta"
  timeout: 120
  temperature: 1.0
  max_tokens: 40000
  num_retries: 1
  fallback_models: []

# ── AI 分析 ──
ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 150
  include_rss: true                    # 开启：英文科技源纳入分析
  include_standalone: true             # 财联社/见闻全量纳入分析（即使不推送展示）
  include_rank_timeline: true          # 保留排名轨迹，利于 AI 判断热点演化

# ── AI 翻译 ──
ai_translation:
  enabled: true
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: true                          # 英文 RSS 标题自动翻为中文
    standalone: true

# ── 高级设置（保持默认）──
advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
